<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estructura con Columnas - Servicios</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #03a1bd;
            padding: 10px 20px;
        }

        .logo-pequeno {
            width: 300px;
            height: auto;
            display: block;
        }

        .barra-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .boton-nav {
            text-decoration: none;
            color: #333333;
            background-color: #69eeff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            transition: background-color 0.3s ease;
        }

        .boton-nav.activo {
            background-color: #edb7ff;
            color: #ffffff;
            font-weight: bold;
        }

        .boton-nav:hover {
            background-color: rgb(245, 148, 1);
            color: white;
        }

        main {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        aside {
            width: 25%;
            background-color: #f0f0f0;
            padding: 15px;
        }

        .imagen-publicidad {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        .imagen-articulo {
            width: 50%;
            max-width: 300px;
            height: auto;
            display: block;
            margin: 15px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        section {
            width: 75%;
            background-color: #e0f7fa;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">mis gustos</h1>
            <nav class="barra-navegacion">
                <a href="index.html" class="boton-nav">Inicio</a>
                <a href="archivo1.html" class="boton-nav activo">sobre mi </a>
                <a href="archivo2.html" class="boton-nav">mi mundo</a>
            </nav>
        </div>
        <img src="ivanna.jpg" alt="Logo de Mi Sitio Web" title="Logo de la marca" class="logo-pequeno">
    </header>

    <main>
        <aside>
            <h3>Publicidad</h3>
            <p>¡Prueba crumbolll cookies tu mejor aliado!</p>
            <img src="ivanna2.jpg" alt="Publicidad de Cookies" class="imagen-publicidad">
        </aside>
        <section>
            <article>
                <h2>mis gustos</h2>
                <img src="maquillaje.jpg" alt="Los ksimeritos" class="imagen-articulo">
                <img src="peliculas.jpg" alt="Los ksimeritos" class="imagen-articulo">
                <img src="aguachilee.jpg" alt="Los ksimeritos" class="imagen-articulo">
                <img src="pay.jpg" alt="Los ksimeritos" class="imagen-articulo">


                <p>me gusta mucho maquillarme y cuidar mi piel.</p>
                <p>me gusta mucho mirar peliculas y series en mi cama.</p>
                <p>me encanta el aguachile verde.</p>
                <p>me gusta mucho el pay de limon.</p>
            </article>
        </section>
    </main>

    <footer>
        <p>redes sociales bannillaa</p>
    </footer>
</body>

</html>
